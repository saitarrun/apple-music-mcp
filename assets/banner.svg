<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="50%" stop-color="#111116"/>
      <stop offset="100%" stop-color="#16151d"/>
    </linearGradient>

    <!-- Apple Music Iconic Vibrant Gradient -->
    <linearGradient id="appleMusicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA2D55"/>
      <stop offset="50%" stop-color="#FA243C"/>
      <stop offset="100%" stop-color="#FF5E3A"/>
    </linearGradient>

    <!-- Subtle Accent Glow -->
    <radialGradient id="glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FA2D55" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FA2D55" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="glowRight" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#FF5E3A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF5E3A" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Linear Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Ambient Glows -->
  <rect width="1200" height="360" rx="16" fill="url(#glow)"/>
  <rect width="1200" height="360" rx="16" fill="url(#glowRight)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Left Icon Container -->
  <g transform="translate(100, 95)">
    <!-- Icon Backdrop -->
    <rect width="90" height="90" rx="22" fill="#1b1a24" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Music Note Icon with Apple Music Gradient -->
    <path d="M57 32.5V56.5C57 59.8137 54.3137 62.5 51 62.5C47.6863 62.5 45 59.8137 45 56.5C45 53.1863 47.6863 50.5 51 50.5C52.1741 50.5 53.2709 50.8384 54.1953 51.4239V39.2308L39 42.6077V61.5C39 64.8137 36.3137 67.5 33 67.5C29.6863 67.5 27 64.8137 27 61.5C27 58.1863 29.6863 55.5 33 55.5C34.1741 55.5 35.2709 55.8384 36.1953 56.4239V36.5C36.1953 34.9812 37.3323 33.7013 38.8415 33.5336L54.8415 31.7558C56.0305 31.6237 57 32.5539 57 33.75V32.5Z" fill="url(#appleMusicGrad)"/>
    
    <!-- Equalizer Soundwaves Accent -->
    <rect x="23" y="105" width="4" height="14" rx="2" fill="#FA2D55" opacity="0.6"/>
    <rect x="31" y="101" width="4" height="22" rx="2" fill="#FA2D55" opacity="0.8"/>
    <rect x="39" y="97" width="4" height="30" rx="2" fill="url(#appleMusicGrad)"/>
    <rect x="47" y="103" width="4" height="18" rx="2" fill="#FA2D55" opacity="0.75"/>
    <rect x="55" y="99" width="4" height="26" rx="2" fill="url(#appleMusicGrad)"/>
    <rect x="63" y="105" width="4" height="14" rx="2" fill="#FF5E3A" opacity="0.6"/>
  </g>

  <!-- Typography & Brand Text -->
  <g transform="translate(230, 0)">
    <!-- Category Super-Title -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3.5" fill="#FA2D55" text-transform="uppercase">MODEL CONTEXT PROTOCOL</text>
    
    <!-- Main Title -->
    <text x="0" y="172" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8" fill="#FFFFFF">Apple Music MCP</text>
    
    <!-- Tagline Subtitle -->
    <text x="0" y="208" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#9DA0AC" letter-spacing="0.2">
      High-efficiency dual native &amp; cloud engine with cross-platform discovery
    </text>

    <!-- Minimalist Badges -->
    <g transform="translate(0, 240)">
      <!-- Badge 1: Native macOS JXA -->
      <g transform="translate(0, 0)">
        <rect width="138" height="28" rx="14" fill="#1e1d27" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
        <circle cx="14" cy="14" r="4" fill="#30D158"/>
        <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11.5" font-weight="600" fill="#E2E4EB">macOS Native JXA</text>
      </g>

      <!-- Badge 2: Async Cloud API -->
      <g transform="translate(150, 0)">
        <rect width="130" height="28" rx="14" fill="#1e1d27" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
        <circle cx="14" cy="14" r="4" fill="#0A84FF"/>
        <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11.5" font-weight="600" fill="#E2E4EB">Cloud REST API</text>
      </g>

      <!-- Badge 3: Cross-Platform Charts -->
      <g transform="translate(292, 0)">
        <rect width="162" height="28" rx="14" fill="#1e1d27" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
        <circle cx="14" cy="14" r="4" fill="#BF5AF2"/>
        <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11.5" font-weight="600" fill="#E2E4EB">Cross-Platform Charts</text>
      </g>

      <!-- Badge 4: Zero-Timeout -->
      <g transform="translate(466, 0)">
        <rect width="118" height="28" rx="14" fill="#1e1d27" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
        <circle cx="14" cy="14" r="4" fill="#FF9F0A"/>
        <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11.5" font-weight="600" fill="#E2E4EB">Zero-Timeout</text>
      </g>
    </g>
  </g>
</svg>
