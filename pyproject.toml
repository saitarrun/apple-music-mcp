[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apple-music-mcp"
version = "1.0.0"
description = "High-efficiency Apple Music MCP Server with Dual Native & Cloud Engines, Async Batching, and Smart Caching"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "xploit404" }
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
apple-music-mcp = "apple_music_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_music_mcp"]
